name: Build FrameSnap EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pyinstaller mss pillow numpy

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name FrameSnap --manifest dpi_aware.manifest framesnap.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrameSnap-Windows
        path: dist/FrameSnap.exe
        retention-days: 30
